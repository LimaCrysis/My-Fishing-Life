<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b7285" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Fishing Life" />
  <title>My Fishing Life</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css?v=14.11.0" />
  <link rel="stylesheet" href="css/conditions.css?v=14.11.0" />
  <link rel="stylesheet" href="css/realmap.css?v=14.11.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar brand-topbar">
      <div class="brand-lockup" aria-label="My Fishing Life">
        <span class="brand-my">MY</span>
        <h1>FISHING LIFE</h1>
        <span class="brand-line" aria-hidden="true"></span>
      </div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>ホーム</small></button>
      <button data-view="trips" class="nav-item"><span>🎣</span><small>釣行</small></button>
      <button data-view="encyclopedia" class="nav-item"><span>🐟</span><small>図鑑</small></button>
      <button data-view="guide" class="nav-item"><span>📖</span><small>手引き</small></button>
      <button data-view="fishingmap" class="nav-item"><span>🗺️</span><small>釣地図</small></button>
    </nav>
  </div>

  <dialog id="catchDialog" class="sheet-dialog">
    <form id="catchForm" method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <p class="eyebrow">CATCH RECORD</p>
          <h2>釣れた！を記録</h2>
        </div>
        <button type="button" class="close-button" data-close>×</button>
      </div>

      <div class="quick-record-hint">よく使う項目を上から選ぶだけ。写真やメモは後からでもOK。</div>
      <label>使用タックル
        <select id="catchTackle"><option value="">未選択</option></select>
      </label>
      <label>魚種
        <select id="fishName" required></select>
      </label>
      <div id="quickFish" class="quick-fish" aria-label="最近釣った魚"></div>
      <div class="two-cols">
        <label>サイズ（cm）
          <input id="fishSize" type="number" min="0" max="300" step="0.1" inputmode="decimal" placeholder="例 18.5" />
        </label>
        <label>匹数
          <span class="count-stepper"><button type="button" id="countMinus" aria-label="匹数を減らす">−</button><input id="fishCount" type="number" min="1" max="999" value="1" inputmode="numeric" required /><button type="button" id="countPlus" aria-label="匹数を増やす">＋</button></span>
        </label>
      </div>
      <label>釣り方
        <select id="method">
          <option>ちょい投げ</option>
          <option>ジグヘッド</option>
          <option>サビキ</option>
          <option>ルアー</option>
          <option>エサ釣り</option>
          <option>その他</option>
        </select>
      </label>
      <details class="optional-fields">
        <summary>仕掛け・写真・メモを追加</summary>
        <label>仕掛け・エサ・ルアー
          <input id="rig" type="text" placeholder="例：8号オモリ＋イソメ" />
        </label>

        <details class="field-data-fields">
          <summary>🎯 実釣データを残す</summary>
          <p class="field-data-hint">あとで「何で釣れたか」を振り返るための任意項目です。</p>

          <div id="jigFieldData" class="field-method-block">
            <div class="two-cols">
              <label>ジグヘッド
                <select id="jigHeadWeight">
                  <option value="">未記録</option>
                  <option value="7g">7g</option>
                  <option value="14g">14g</option>
                  <option value="その他">その他</option>
                </select>
              </label>
              <label>ワームカラー
                <select id="wormColor">
                  <option value="">未記録</option>
                  <option value="#163">#163 夜光・クリア系</option>
                  <option value="#183">#183 ブルー/シルバー系</option>
                  <option value="その他">その他</option>
                </select>
              </label>
            </div>
          </div>

          <div id="baitFieldData" class="field-method-block">
            <label>エサ
              <input id="fieldBait" type="text" placeholder="例：アオイソメ / アミエビ" />
            </label>
          </div>

          <div class="two-cols">
            <label>ヒットした層
              <select id="hitZone">
                <option value="">未記録</option>
                <option>表層</option>
                <option>中層</option>
                <option>底</option>
                <option>足元</option>
              </select>
            </label>
            <label>潮の動き
              <select id="fieldTide">
                <option value="">未記録</option>
                <option>上げ潮</option>
                <option>下げ潮</option>
                <option>潮止まり付近</option>
                <option>不明</option>
              </select>
            </label>
          </div>
        </details>
      <div class="segmented" role="group" aria-label="持ち帰り区分">
        <input type="radio" id="keep" name="result" value="持ち帰り" checked><label for="keep">持ち帰り</label>
        <input type="radio" id="release" name="result" value="リリース"><label for="release">リリース</label>
      </div>
      <label>写真
        <input id="fishPhoto" type="file" accept="image/*" capture="environment" />
      </label>
      <label>メモ
        <textarea id="catchNote" rows="3" placeholder="潮、反応、料理の予定など"></textarea>
      </label>
      </details>
      <button class="primary-button catch-save-button" value="save">釣果を記録する</button>
    </form>
  </dialog>


  <dialog id="tripDialog" class="sheet-dialog">
    <form id="tripForm" method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div><p class="eyebrow">NEW TRIP</p><h2>釣行を始める</h2></div>
        <button type="button" class="close-button" data-close>×</button>
      </div>
      <label>釣り場<input id="tripPlace" type="text" placeholder="例：大洗港" required /></label>
      <div class="two-cols">
        <label>日付<input id="tripDate" type="date" required /></label>
        <label>開始時刻<input id="tripStart" type="time" required /></label>
      </div>
      <label>天気
        <select id="tripWeather"><option>晴れ</option><option>くもり</option><option>雨</option><option>風が強い</option></select>
      </label>
      <label>メモ<textarea id="tripNote" rows="3" placeholder="狙う魚や今日試したいこと"></textarea></label>
      <button class="primary-button" value="save">釣行を開始</button>
    </form>
  </dialog>

  <dialog id="tackleDialog" class="sheet-dialog">
    <form id="tackleForm" method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div><p class="eyebrow">MY TACKLE</p><h2>タックルを登録</h2></div>
        <button type="button" class="close-button" data-close>×</button>
      </div>
      <label>タックル名
        <input id="tackleName" type="text" placeholder="例：相棒" required />
      </label>
      <label>ロッド
        <input id="tackleRod" type="text" placeholder="例：スカイハイ100MH" required />
      </label>
      <label>リール
        <input id="tackleReel" type="text" placeholder="例：フリームス LT3000-CXH" />
      </label>
      <label>ライン
        <input id="tackleLine" type="text" placeholder="例：カーボナイロン3号" />
      </label>
      <button class="primary-button" value="save">このタックルを登録</button>
    </form>
  </dialog>

  <div id="catchToast" class="catch-toast" role="status" aria-live="assertive"></div>

  <template id="emptyTemplate">
    <section class="empty-state"><div class="empty-icon">🎣</div><h2></h2><p></p></section>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/official-status.js?v=14.11.0"></script>
  <script src="js/conditions.js?v=14.11.0"></script>
  <script src="js/conditions-ui.js?v=14.11.0"></script>
  <script src="js/app.js?v=14.11.0"></script>
</body>
</html>
